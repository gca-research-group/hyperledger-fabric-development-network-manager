services:
  peer0.org1.example.org:
    container_name: peer0.org1.example.org
    image: hyperledger/fabric-peer:2.5.15
    environment:
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_ID=peer0.org1.example.org
      - CORE_PEER_ADDRESS=peer0.org1.example.org:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.org:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.org:7051
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_GOSSIP_STATE_ENABLED=true
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.peer0.org1.example.org:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=example
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=false
      - CORE_PEER_TLS_CLIENTCERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_CLIENTKEY_FILE=/etc/hyperledger/fabric/tls/server.key
    working_dir: /etc/hyperledger/fabric
    command: peer node start
    networks:
      - example
    depends_on:
      couchdb.peer0.org1.example.org:
        condition: service_healthy
    ports:
      - 7051:7051
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./org1.example.org/data/certificate-authority/organizations/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/msp:/etc/hyperledger/fabric/msp
      - ./org1.example.org/data/certificate-authority/organizations/peerOrganizations/org1.example.org/peers/peer0.org1.example.org/tls:/etc/hyperledger/fabric/tls
      - ./org1.example.org/data/peers/peer0/peer:/var/hyperledger/production
  couchdb.peer0.org1.example.org:
    container_name: couchdb.peer0.org1.example.org
    image: couchdb:latest
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    volumes:
      - ./org1.example.org/data/peers/peer0/couchdb:/opt/couchdb/data
    networks:
      - example
    healthcheck:
      test: [CMD, curl, -f, 'http://admin:adminpw@localhost:5984/']
      interval: 5s
      timeout: 5s
      retries: 10
