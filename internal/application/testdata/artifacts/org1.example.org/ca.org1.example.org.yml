services:
  ca.org1.example.org:
    image: hyperledger/fabric-ca:latest
    container_name: ca.org1.example.org
    tty: true
    stdin_open: true
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.org1.example.org
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_CSR_CN=ca.org1.example.org
      - FABRIC_CA_SERVER_CSR_HOSTS=localhost,ca.org1.example.org
    command: sh -c 'fabric-ca-server start -b admin:adminpw'
    volumes:
      - ./org1.example.org/data/certificate-authority/fabric-ca-server:/etc/hyperledger/fabric-ca-server
      - ./org1.example.org/data/certificate-authority/organizations:/etc/hyperledger/organizations
    ports:
      - 7054:7054
    networks:
      - example
